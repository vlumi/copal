<svg xmlns="http://www.w3.org/2000/svg" width="970" height="408" viewBox="0 0 970 408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
<style>
.box { fill: #ffffff; stroke: #57606a; stroke-width: 1 }
