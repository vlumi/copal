.box.highlight { stroke: #c2410c; stroke-width: 2.5 }
.edge.highlight { stroke: #c2410c; stroke-width: 2 }
.head.highlight { fill: #c2410c }
@media (prefers-color-scheme: dark) {
  .box { fill: #161b22; stroke: #8b949e }
