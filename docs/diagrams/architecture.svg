<svg xmlns="http://www.w3.org/2000/svg" width="710" height="322" viewBox="0 0 710 322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
<style>
.box { fill: #ffffff; stroke: #57606a; stroke-width: 1 }
