  .box.external { fill: #3a2c12; stroke: #d6a64a }
  .label { fill: #e6edf3 }
  .edge { stroke: #6e7681 }
  .head { fill: #6e7681 }
  .legend { fill: #0d1117; stroke: #30363d }
  .edge-label { fill: #9da5ae; stroke: #0d1117 }
  .box.highlight, .edge.highlight { stroke: #fb923c }
  .head.highlight { fill: #fb923c }
}
</style>
