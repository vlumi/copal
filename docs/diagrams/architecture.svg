<path class="edge" d="M429,138 C429,161 502,161 502,184 L502,252 C502,271 370,271 370,290" marker-end="url(#arrow)"/>
<path class="edge" d="M120,252 C120,271 252,271 252,290" marker-end="url(#arrow)"/>
<path class="edge" d="M311,338 C311,357 311,357 311,376" marker-end="url(#arrow)"/>
<g><rect class="box" x="168" y="12" width="237" height="40" rx="4"/><text class="label first" x="286" y="29" text-anchor="middle">console</text><text class="label" x="286" y="43" text-anchor="middle">runs the bank, shows its survey</text></g>
<g><rect class="box" x="351" y="98" width="104" height="40" rx="4"/><text class="label first" x="403" y="115" text-anchor="middle">survey</text><text class="label" x="403" y="129" text-anchor="middle">the analyzer</text></g>
<g><rect class="box" x="12" y="184" width="216" height="68" rx="4"/><text class="label first" x="120" y="201" text-anchor="middle">the specimens</text><text class="label" x="120" y="215" text-anchor="middle">pangaea, the bank</text><text class="label" x="120" y="229" text-anchor="middle">laurasia, the card processor</text><text class="label" x="120" y="243" text-anchor="middle">gondwana, the life insurer</text></g>
<g><rect class="box data" x="271" y="198" width="209" height="40" rx="13"/><text class="label first" x="375" y="215" text-anchor="middle">blueprints, oracle</text><text class="label" x="375" y="229" text-anchor="middle">the survey of each specimen</text></g>
<g><rect class="box" x="193" y="298" width="237" height="40" rx="4"/><text class="label first" x="311" y="315" text-anchor="middle">bedrock</text><text class="label" x="311" y="329" text-anchor="middle">running programs, jobs, scripts</text></g>
<g><rect class="box" x="203" y="384" width="216" height="54" rx="4"/><text class="label first" x="311" y="401" text-anchor="middle">cobolith, a library</text><text class="label" x="311" y="415" text-anchor="middle">COBOL, JCL, layouts, records</text><text class="label" x="311" y="429" text-anchor="middle">imported by every part</text></g>
