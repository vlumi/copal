<svg xmlns="http://www.w3.org/2000/svg" width="728" height="364" viewBox="0 0 728 364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
<style>
.box { fill: #ffffff; stroke: #57606a; stroke-width: 1 }
.box.emphasis { stroke-width: 2.5 }
.box.data { fill: #e8eef6; stroke: #8c959f }
.box.external { fill: #fbecd0; stroke: #a16207; stroke-width: 2 }
.box.dashed { stroke-dasharray: 4 3 }
.label { fill: #1f2328 }
.label.first { font-weight: 600 }
.edge { fill: none; stroke: #8c959f; stroke-width: 1.2 }
.edge.dashed { stroke-dasharray: 4 3 }
.edge.dotted { stroke-dasharray: 1 3 }
.head { fill: #8c959f }
.legend { fill: #f6f8fa; stroke: #d0d7de }
.edge-label { fill: #57606a; font-size: 11px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round }
.box.highlight { stroke: #c2410c; stroke-width: 2.5 }
.edge.highlight { stroke: #c2410c; stroke-width: 2 }
.head.highlight { fill: #c2410c }
@media (prefers-color-scheme: dark) {
  .box { fill: #161b22; stroke: #8b949e }
  .box.data { fill: #1f2a3a; stroke: #6e7681 }
  .box.external { fill: #3a2c12; stroke: #d6a64a }
  .label { fill: #e6edf3 }
  .edge { stroke: #6e7681 }
  .head { fill: #6e7681 }
  .legend { fill: #0d1117; stroke: #30363d }
  .edge-label { fill: #9da5ae; stroke: #0d1117 }
  .box.highlight, .edge.highlight { stroke: #fb923c }
  .head.highlight { fill: #fb923c }
}
</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="0" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L8,4 L0,8 z"/></marker><marker id="arrow-highlight" viewBox="0 0 8 8" refX="0" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head highlight" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<path class="edge dotted" d="M239,52 C239,71 195,71 195,90" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M265,52 C265,78 457,78 457,104" marker-end="url(#arrow)"/>
<path class="edge" d="M213,52 C213,75 65,75 65,98 L65,166 C65,185 91,185 91,204" marker-end="url(#arrow)"/>
<path class="edge" d="M195,166 C195,185 170,185 170,204" marker-end="url(#arrow)"/>
<path class="edge" d="M130,252 C130,271 130,271 130,290" marker-end="url(#arrow)"/>
<g><rect class="box" x="187" y="12" width="104" height="40" rx="4"/><text class="label first" x="239" y="29" text-anchor="middle">survey</text><text class="label" x="239" y="43" text-anchor="middle">the analyzer</text></g>
<g><rect class="box" x="87" y="98" width="216" height="68" rx="4"/><text class="label first" x="195" y="115" text-anchor="middle">the specimens</text><text class="label" x="195" y="129" text-anchor="middle">pangaea, the bank</text><text class="label" x="195" y="143" text-anchor="middle">laurasia, the card processor</text><text class="label" x="195" y="157" text-anchor="middle">gondwana, the life insurer</text></g>
<g><rect class="box data" x="353" y="112" width="209" height="40" rx="13"/><text class="label first" x="457" y="129" text-anchor="middle">blueprints, oracle</text><text class="label" x="457" y="143" text-anchor="middle">the survey of each specimen</text></g>
<g><rect class="box" x="12" y="212" width="237" height="40" rx="4"/><text class="label first" x="130" y="229" text-anchor="middle">bedrock</text><text class="label" x="130" y="243" text-anchor="middle">running programs, jobs, scripts</text></g>
<g><rect class="box" x="22" y="298" width="216" height="54" rx="4"/><text class="label first" x="130" y="315" text-anchor="middle">cobolith, a library</text><text class="label" x="130" y="329" text-anchor="middle">COBOL, JCL, layouts, records</text><text class="label" x="130" y="343" text-anchor="middle">imported by every part</text></g>
<g class="legend-keys"><rect class="legend" x="574" y="12" width="142" height="116" rx="4"/>
<rect class="box" x="582" y="23" width="34" height="14" rx="3"/>
<text class="label" x="624" y="34">Go, one part</text>
<rect class="box data" x="582" y="43" width="34" height="14" rx="7"/>
<text class="label" x="624" y="54">files</text>
<path class="edge" d="M582,70 L608,70" marker-end="url(#arrow)"/>
<text class="label" x="624" y="74">imports</text>
<path class="edge dashed" d="M582,90 L608,90" marker-end="url(#arrow)"/>
<text class="label" x="624" y="94">writes</text>
<path class="edge dotted" d="M582,110 L608,110" marker-end="url(#arrow)"/>
<text class="label" x="624" y="114">reads</text>
</g>
</svg>
