<a href="../../../gondwana/programs/GLD020.cbl#L257"><title>ｼｮﾘ-RTN: 保障中の契約の応当日を求め、処理すべきなら処理し、 書き戻す。</title><rect class="box" x="908" y="84" width="111" height="26" rx="4"/><text class="label" x="963" y="101" text-anchor="middle">ｼｮﾘ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L278"><title>ｵｳﾄｳﾋﾞ-RTN: 今回の応当日は、契約日の月日を業務年に置いた日、 業務日付より後なら前年の。契約日より後で、前回業務日付 (制御 レコード) より後か業務日付に等しければ処理する。開設日と 再実行では前回業務日付が業務日付に等しく、当日の分を処理する。</title><rect class="box" x="1091" y="156" width="174" height="26" rx="4"/><text class="label" x="1178" y="173" text-anchor="middle">ｵｳﾄｳﾋﾞ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L303"><title>ｵｳﾄｳ-RTN: 経過年数を進め、貸付残高があれば利息を繰り入れ、 応当日が満期日なら商品により満期か更新。そうでなく貸付残高 があれば解約返戻金と比べる。</title><rect class="box" x="1283" y="156" width="132" height="26" rx="4"/><text class="label" x="1349" y="173" text-anchor="middle">ｵｳﾄｳ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L325"><title>ﾘｿｸ-RTN: 応当日までの貸付利息を残高に繰り入れ、起算日を 応当日にする。起算日のない残高は応当日から利息が付く。</title><rect class="box" x="598" y="228" width="111" height="26" rx="4"/><text class="label" x="653" y="245" text-anchor="middle">ﾘｿｸ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L343"><title>ﾁｮｳｶ-RTN: 貸付残高が解約返戻金を超えていれば失効とする。</title><rect class="box" x="1093" y="228" width="132" height="26" rx="4"/><text class="label" x="1159" y="245" text-anchor="middle">ﾁｮｳｶ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L363"><title>ﾏﾝｷ-RTN: 満期保険金に配当累計を加え、貸付残高を引いて 支払い、満期とする。</title><rect class="box" x="727" y="228" width="111" height="26" rx="4"/><text class="label" x="782" y="245" text-anchor="middle">ﾏﾝｷ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L407"><title>ｺｳｼﾝ-RTN: 定期保険の更新。応当日時点の保険年齢が商品の最高 年齢以内なら保険料を引き直して応当日から期間を延ばし、超えて いれば期間満了。</title><rect class="box" x="943" y="228" width="132" height="26" rx="4"/><text class="label" x="1009" y="245" text-anchor="middle">ｺｳｼﾝ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L448"><title>ｼﾜｹ-RTN: 仕訳1行。科目、貸借、金額、摘要は呼ぶ側が入れる。</title><rect class="box" x="874" y="300" width="111" height="26" rx="4"/><text class="label" x="929" y="317" text-anchor="middle">ｼﾜｹ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L464"><title>ﾒｲｻｲ-RTN: 1件の明細行。</title><rect class="box" x="1243" y="228" width="132" height="26" rx="4"/><text class="label" x="1309" y="245" text-anchor="middle">ﾒｲｻｲ-RTN</text></a>
