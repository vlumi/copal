<a href="../../../gondwana/copybooks/RATLOD.cpy#L16"><title>ﾘｮｳﾘﾂ-ﾖﾐｺﾐ-RTN: 料率を商品・性別・年齢のテーブルに読み込む。 商品テーブルにない商品の料率は読み飛ばす。</title><rect class="box" x="541" y="156" width="244" height="26" rx="4"/><text class="label" x="663" y="173" text-anchor="middle">ﾘｮｳﾘﾂ-ﾖﾐｺﾐ-RTN</text></a>
