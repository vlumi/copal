<a href="../../../gondwana/programs/GLD020.cbl#L278"><title>ｼｮﾘ-RTN: 保障中の契約の応当日を求め、処理すべきなら処理し、 書き戻す。</title><rect class="box" x="948" y="84" width="111" height="26" rx="4"/><text class="label" x="1003" y="101" text-anchor="middle">ｼｮﾘ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L299"><title>ｵｳﾄｳﾋﾞ-RTN: 今回の応当日は、契約日の月日を業務年に置いた日、 業務日付より後なら前年の。契約日より後で、前回業務日付 (制御 レコード) より後か業務日付に等しければ処理する。開設日と 再実行では前回業務日付が業務日付に等しく、当日の分を処理する。</title><rect class="box" x="1173" y="156" width="174" height="26" rx="4"/><text class="label" x="1260" y="173" text-anchor="middle">ｵｳﾄｳﾋﾞ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L324"><title>ｵｳﾄｳ-RTN: 経過年数を進め、貸付残高があれば利息を繰り入れ、 主契約、次いで特約を処理する。まだ保障中で貸付残高があれば 解約返戻金と比べる。保険料は有効な保障の保険料の合計に直す。</title><rect class="box" x="1365" y="156" width="132" height="26" rx="4"/><text class="label" x="1431" y="173" text-anchor="middle">ｵｳﾄｳ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L346"><title>ｼｭｹｲﾔｸ-RTN: 主契約の保障を読み、応当日が満期日なら養老保険 は満期、ほかは更新か期間満了。</title><rect class="box" x="812" y="228" width="174" height="26" rx="4"/><text class="label" x="899" y="245" text-anchor="middle">ｼｭｹｲﾔｸ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L375"><title>ｼｭｹｲﾔｸ-ｺｳｼﾝ-RTN: 主契約の更新か期間満了を契約に映す。</title><rect class="box" x="1047" y="300" width="265" height="26" rx="4"/><text class="label" x="1179" y="317" text-anchor="middle">ｼｭｹｲﾔｸ-ｺｳｼﾝ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L391"><title>ﾄｸﾔｸ-ｿｳｻ-RTN: 契約の特約を保障番号順にたどる。</title><rect class="box" x="1482" y="228" width="202" height="26" rx="4"/><text class="label" x="1583" y="245" text-anchor="middle">ﾄｸﾔｸ-ｿｳｻ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L413"><title>ﾄｸﾔｸ-RTN: 有効な特約1件。主契約が終わっていればともに満了、 応当日が特約の満期日なら更新か満了。</title><rect class="box" x="1382" y="300" width="132" height="26" rx="4"/><text class="label" x="1448" y="317" text-anchor="middle">ﾄｸﾔｸ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L433"><title>ﾄｸﾔｸ-ﾒｲｻｲ-RTN: 更新か満了した特約を数え、明細行を書く。</title><rect class="box" x="1303" y="372" width="223" height="26" rx="4"/><text class="label" x="1414" y="389" text-anchor="middle">ﾄｸﾔｸ-ﾒｲｻｲ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L449"><title>ﾎｼｮｳ-ｶｷﾓﾄﾞｼ-RTN: 変えた保障を書き戻す。</title><rect class="box" x="819" y="372" width="265" height="26" rx="4"/><text class="label" x="951" y="389" text-anchor="middle">ﾎｼｮｳ-ｶｷﾓﾄﾞｼ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L461"><title>ﾘｿｸ-RTN: 応当日までの貸付利息を残高に繰り入れ、起算日を 応当日にする。起算日のない残高は応当日から利息が付く。</title><rect class="box" x="598" y="228" width="111" height="26" rx="4"/><text class="label" x="653" y="245" text-anchor="middle">ﾘｿｸ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L479"><title>ﾁｮｳｶ-RTN: 貸付残高が解約返戻金を超えていれば失効とする。</title><rect class="box" x="1135" y="228" width="132" height="26" rx="4"/><text class="label" x="1201" y="245" text-anchor="middle">ﾁｮｳｶ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L499"><title>ﾏﾝｷ-RTN: 満期保険金に配当累計を加え、貸付残高を引いて 支払い、満期とする。</title><rect class="box" x="918" y="300" width="111" height="26" rx="4"/><text class="label" x="973" y="317" text-anchor="middle">ﾏﾝｷ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L543"><title>ｺｳｼﾝ-RTN: 満期日に達した保障の更新。応当日時点の保険年齢が 商品の最高年齢以内なら保険料を引き直して応当日から期間を 延ばし、超えていれば満了とする。</title><rect class="box" x="1101" y="372" width="132" height="26" rx="4"/><text class="label" x="1167" y="389" text-anchor="middle">ｺｳｼﾝ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L580"><title>ｼﾜｹ-RTN: 仕訳1行。科目、貸借、金額、摘要は呼ぶ側が入れる。</title><rect class="box" x="690" y="372" width="111" height="26" rx="4"/><text class="label" x="745" y="389" text-anchor="middle">ｼﾜｹ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L596"><title>ﾒｲｻｲ-RTN: 1件の明細行。</title><rect class="box" x="1332" y="228" width="132" height="26" rx="4"/><text class="label" x="1398" y="245" text-anchor="middle">ﾒｲｻｲ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L606"><title>ﾎｳｺｸ-RTN: 件数。</title><rect class="box" x="1077" y="84" width="132" height="26" rx="4"/><text class="label" x="1143" y="101" text-anchor="middle">ﾎｳｺｸ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L640"><title>ｼｭｳﾘｮｳ-RTN: 制御レコードを書き戻し、ファイルを閉じる。</title><rect class="box" x="1705" y="84" width="174" height="26" rx="4"/><text class="label" x="1792" y="101" text-anchor="middle">ｼｭｳﾘｮｳ-RTN</text></a>
<a href="../../../gondwana/programs/GLD020.cbl#L655"><title>ｲｼﾞｮｳ-RTN: ファイル異常は 16 で終わる。</title><rect class="box" x="954" y="444" width="153" height="26" rx="4"/><text class="label" x="1030" y="461" text-anchor="middle">ｲｼﾞｮｳ-RTN</text></a>
