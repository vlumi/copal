<a href="../../../gondwana/programs/GLD030.cbl#L453"><title>ﾎｼｮｳ-ｿｳｻ-RTN: 契約の保障を保障番号順にたどり、事由発生日に 有効であった保障から死亡保険金額の合計と入院の保障を求める。 死亡保障のない契約の死亡請求は却下、入院と手術の請求は入院 の検査へ。</title><rect class="box" x="789" y="228" width="202" height="26" rx="4"/><text class="label" x="890" y="245" text-anchor="middle">ﾎｼｮｳ-ｿｳｻ-RTN</text></a>
<a href="../../../gondwana/programs/GLD030.cbl#L484"><title>ﾎｼｮｳ-ﾊﾝﾃｲ-RTN: 保障1件。事由発生日に有効であったなら、医療 の保障は最初の1件を入院の保障とし、ほかは保険金額を死亡 保険金額に加える。</title><rect class="box" x="661" y="300" width="223" height="26" rx="4"/><text class="label" x="772" y="317" text-anchor="middle">ﾎｼｮｳ-ﾊﾝﾃｲ-RTN</text></a>
<a href="../../../gondwana/programs/GLD030.cbl#L516"><title>ﾆｭｳｲﾝ-ｹﾝｻ-RTN: 入院の保障があること、日数か倍率、その保障の 免責期間、次いで給付履歴。</title><rect class="box" x="902" y="300" width="223" height="26" rx="4"/><text class="label" x="1013" y="317" text-anchor="middle">ﾆｭｳｲﾝ-ｹﾝｻ-RTN</text></a>
