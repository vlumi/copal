<a href="../../../gondwana/copybooks/PRMLOG.cpy#L14"><title>PRMLOG: 収納履歴に残す手続き PROCEDURE DIVISION に COPY する。作業領域は PRMCAL。 ｼｭｳﾉｳ-ｷﾛｸ-RTN は、種別、金額、回数を入れた後、契約マスタの 払込済年月を進めてから PERFORM する。証券番号、業務日付、 払込済年月を加えて GLC050 を呼ぶ。ｼｭｳﾉｳ-ｸﾛｰｽﾞ-RTN は終了時 に PERFORM する。書けなければ ｲｼﾞｮｳ-RTN へ。 変更履歴 日付       担当 変更 2026-11-19 YN   GL-0827 初版。</title><rect class="box" x="1660" y="228" width="223" height="26" rx="4"/><text class="label" x="1771" y="245" text-anchor="middle">ｼｭｳﾉｳ-ｷﾛｸ-RTN</text></a>
