<a href="../../../pangaea/programs/TXPOST.cbl#L246"><title>ONE STEP OF THE MATCH, BY WHICHEVER KEY IS LOWER: REJECT A TRANSACTION FOR A MISSING ACCOUNT, APPLY ONE TO ITS ACCOUNT, OR WRITE A FINISHED ACCOUNT.</title><rect class="box" x="355" y="84" width="90" height="26" rx="4"/><text class="label" x="400" y="101" text-anchor="middle">2000-MATCH</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L261"><title>APPLY ONE TRANSACTION TO ITS ACCOUNT BY THE POSTING RULES.</title><rect class="box" x="453" y="156" width="125" height="26" rx="4"/><text class="label" x="515" y="173" text-anchor="middle">3000-APPLY-TRAN</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L290"><title>CREDIT A DEPOSIT, A TRANSFER CREDIT, A RETURNED TRANSFER OR INTEREST.</title><rect class="box" x="669" y="228" width="132" height="26" rx="4"/><text class="label" x="735" y="245" text-anchor="middle">3100-POST-CREDIT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L298"><title>DEBIT A WITHDRAWAL OR TRANSFER IF IT STAYS WITHIN THE OVERDRAFT LIMIT. A POSTED TRANSFER SENDS ITS CREDIT ON.</title><rect class="box" x="1126" y="228" width="125" height="26" rx="4"/><text class="label" x="1188" y="245" text-anchor="middle">3200-POST-DEBIT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L316"><title>DEBIT A FEE, OVERDRAFT INTEREST, A MAINTENANCE FEE OR AN ATM FEE, WHATEVER THE BALANCE.</title><rect class="box" x="819" y="228" width="111" height="26" rx="4"/><text class="label" x="874" y="245" text-anchor="middle">3300-POST-FEE</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L324"><title>DEBIT A CARD PURCHASE OR ATM WITHDRAWAL AUTHORIZED ONLINE, WHATEVER THE BALANCE.</title><rect class="box" x="948" y="228" width="160" height="26" rx="4"/><text class="label" x="1028" y="245" text-anchor="middle">3400-POST-AUTHORIZED</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L333"><title>WRITE THE NEXT LEG OF A TRANSFER FOR THE COUNTER ACCOUNT: A TRANSFER CREDIT AFTER A TRANSFER, A RETURN AFTER A CREDIT THAT COULD NOT POST.</title><rect class="box" x="882" y="372" width="118" height="26" rx="4"/><text class="label" x="941" y="389" text-anchor="middle">3500-WRITE-LEG</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L348"><title>RECORD A POSTING IN THE AUDIT TRAIL.</title><rect class="box" x="906" y="300" width="132" height="26" rx="4"/><text class="label" x="972" y="317" text-anchor="middle">3800-WRITE-AUDIT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L362"><title>WRITE THE TRANSACTION TO THE REJECTS WITH ITS REASON. A TRANSFER CREDIT THAT CANNOT POST GOES BACK TO ITS SENDER.</title><rect class="box" x="756" y="300" width="132" height="26" rx="4"/><text class="label" x="822" y="317" text-anchor="middle">3900-REJECT-TRAN</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L372"><title>WRITE AN ACCOUNT, ITS TRANSACTIONS APPLIED, TO THE NEW MASTER.</title><rect class="box" x="596" y="156" width="139" height="26" rx="4"/><text class="label" x="665" y="173" text-anchor="middle">4000-WRITE-MASTER</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L378"><title>THE NEW MASTER MUST HOLD THE OLD BALANCES PLUS WHAT WAS POSTED.</title><rect class="box" x="698" y="84" width="118" height="26" rx="4"/><text class="label" x="757" y="101" text-anchor="middle">5000-RECONCILE</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L390"><title>WRITE THE POSTING REPORT.</title><rect class="box" x="1000" y="84" width="139" height="26" rx="4"/><text class="label" x="1069" y="101" text-anchor="middle">8000-WRITE-REPORT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L436"><title>CLOSE ALL FILES.</title><rect class="box" x="311" y="300" width="132" height="26" rx="4"/><text class="label" x="377" y="317" text-anchor="middle">9000-CLOSE-FILES</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L441"><title>STOP THE RUN WITH RETURN CODE 16, SAYING WHY.</title><rect class="box" x="336" y="228" width="90" height="26" rx="4"/><text class="label" x="381" y="245" text-anchor="middle">9900-ABORT</text></a>
