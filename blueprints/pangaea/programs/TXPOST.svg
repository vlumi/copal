<a href="../../../pangaea/programs/TXPOST.cbl#L164"><title>MATCH UNTIL BOTH FILES END, THEN RECONCILE AND REPORT.</title><rect class="box emphasis" x="442" y="12" width="83" height="26" rx="4"/><text class="label" x="483" y="29" text-anchor="middle">0000-MAIN</text></a>
