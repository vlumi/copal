<a href="../../../pangaea/programs/TXPOST.cbl#L158"><title>MATCH UNTIL BOTH FILES END, THEN RECONCILE AND REPORT.</title><rect class="box emphasis" x="612" y="12" width="83" height="26" rx="4"/><text class="label" x="653" y="29" text-anchor="middle">0000-MAIN</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L175"><title>OPEN THE FILES AND READ THE FIRST RECORD OF EACH. THE AUDIT TRAIL AND THE REJECTS ARE EXTENDED, AND CREATED IF NEW.</title><rect class="box" x="189" y="84" width="125" height="26" rx="4"/><text class="label" x="251" y="101" text-anchor="middle">1000-INITIALIZE</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L202"><title>READ THE NEXT OLD MASTER RECORD, CHECKING ACCOUNT ORDER.</title><rect class="box" x="167" y="156" width="132" height="26" rx="4"/><text class="label" x="233" y="173" text-anchor="middle">1200-READ-MASTER</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L219"><title>READ THE NEXT TRANSACTION, CHECKING ITS ORDER.</title><rect class="box" x="317" y="156" width="118" height="26" rx="4"/><text class="label" x="376" y="173" text-anchor="middle">1300-READ-TRAN</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L237"><title>ONE STEP OF THE MATCH, BY WHICHEVER KEY IS LOWER: REJECT A TRANSACTION FOR A MISSING ACCOUNT, APPLY ONE TO ITS ACCOUNT, OR WRITE A FINISHED ACCOUNT.</title><rect class="box" x="570" y="84" width="90" height="26" rx="4"/><text class="label" x="615" y="101" text-anchor="middle">2000-MATCH</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L252"><title>APPLY ONE TRANSACTION TO ITS ACCOUNT BY THE POSTING RULES.</title><rect class="box" x="785" y="156" width="125" height="26" rx="4"/><text class="label" x="847" y="173" text-anchor="middle">3000-APPLY-TRAN</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L277"><title>CREDIT A DEPOSIT, A TRANSFER CREDIT, A RETURNED TRANSFER OR INTEREST.</title><rect class="box" x="709" y="228" width="132" height="26" rx="4"/><text class="label" x="775" y="245" text-anchor="middle">3100-POST-CREDIT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L285"><title>DEBIT A WITHDRAWAL OR TRANSFER IF IT STAYS WITHIN THE OVERDRAFT LIMIT. A POSTED TRANSFER SENDS ITS CREDIT ON.</title><rect class="box" x="988" y="228" width="125" height="26" rx="4"/><text class="label" x="1050" y="245" text-anchor="middle">3200-POST-DEBIT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L303"><title>DEBIT A FEE, OVERDRAFT INTEREST OR A MAINTENANCE FEE, WHATEVER THE BALANCE.</title><rect class="box" x="859" y="228" width="111" height="26" rx="4"/><text class="label" x="914" y="245" text-anchor="middle">3300-POST-FEE</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L312"><title>WRITE THE NEXT LEG OF A TRANSFER FOR THE COUNTER ACCOUNT: A TRANSFER CREDIT AFTER A TRANSFER, A RETURN AFTER A CREDIT THAT COULD NOT POST.</title><rect class="box" x="566" y="372" width="118" height="26" rx="4"/><text class="label" x="625" y="389" text-anchor="middle">3500-WRITE-LEG</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L327"><title>RECORD A POSTING IN THE AUDIT TRAIL.</title><rect class="box" x="709" y="300" width="132" height="26" rx="4"/><text class="label" x="775" y="317" text-anchor="middle">3800-WRITE-AUDIT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L341"><title>WRITE THE TRANSACTION TO THE REJECTS WITH ITS REASON. A TRANSFER CREDIT THAT CANNOT POST GOES BACK TO ITS SENDER.</title><rect class="box" x="559" y="300" width="132" height="26" rx="4"/><text class="label" x="625" y="317" text-anchor="middle">3900-REJECT-TRAN</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L351"><title>WRITE AN ACCOUNT, ITS TRANSACTIONS APPLIED, TO THE NEW MASTER.</title><rect class="box" x="928" y="156" width="139" height="26" rx="4"/><text class="label" x="997" y="173" text-anchor="middle">4000-WRITE-MASTER</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L357"><title>THE NEW MASTER MUST HOLD THE OLD BALANCES PLUS WHAT WAS POSTED.</title><rect class="box" x="1030" y="84" width="118" height="26" rx="4"/><text class="label" x="1089" y="101" text-anchor="middle">5000-RECONCILE</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L369"><title>WRITE THE POSTING REPORT.</title><rect class="box" x="1166" y="84" width="139" height="26" rx="4"/><text class="label" x="1235" y="101" text-anchor="middle">8000-WRITE-REPORT</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L415"><title>CLOSE ALL FILES.</title><rect class="box" x="12" y="300" width="132" height="26" rx="4"/><text class="label" x="78" y="317" text-anchor="middle">9000-CLOSE-FILES</text></a>
<a href="../../../pangaea/programs/TXPOST.cbl#L420"><title>STOP THE RUN WITH RETURN CODE 16, SAYING WHY.</title><rect class="box" x="100" y="228" width="90" height="26" rx="4"/><text class="label" x="145" y="245" text-anchor="middle">9900-ABORT</text></a>
